id: challenge-move-said-when-asked
tags: [reschedule, challenge]
mode: scripted
persona: "Ece — kısa yazar"
seed:
  - { key: mine, service: "Manikür", day: "wednesday next week", at: "14:00" }
turns:
  - "haftaya cuma 16:00'ya manikür olur mu?"
  - "evet, çarşambakini cumaya taşıyalım"
