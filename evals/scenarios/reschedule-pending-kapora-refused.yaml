id: reschedule-pending-kapora-refused
tags: [reschedule]
mode: scripted
persona: "Elif — kısa yazar"
seed:
  - key: mine
    service: "Cilt Bakımı"
    day: "thursday next week"
    at: "14:00"
    status: pending
