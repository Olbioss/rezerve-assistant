id: challenge-quarter-to-five
tags: [booking, challenge]
mode: scripted
persona: "Elif — günlük konuşur gibi yazar"
turns:
  - "haftaya perşembe beşe çeyrek kala manikür yaptırabilir miyim? adım Elif Kaya"
  - "beşe çeyrek kala olmuyorsa ona en yakın saat olsun"
  - "evet"
# "beşe çeyrek kala" is 16:45, and the salon's times run on the half hour:
# the nearest is 16:30 or 17:00. A misread hour lands anywhere else.
expect:
  bookings:
    - service: "Manikür"
      day: "thursday next week"
      between: ["16:30", "17:00"]
      name: "Elif Kaya"
