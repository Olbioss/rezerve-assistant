# Every push and pull request: lint, types, the test suite against Postgres,
# and the image. The evals stay out: they spend free-tier model quota.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: assistant_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d assistant_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/assistant_test
      PYDANTIC_AI_NO_BANNER: "1"
    steps:
      - uses: actions/checkout@v7
      # Exact: since v8, setup-uv publishes only immutable release tags, no @v10.
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.1"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
      - run: uv run pytest -q

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: rezerve-assistant:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
